site_name: NJU CS · Serving Notes
site_description: 多模态 serving 调度的学习路线与论文精读
site_url: https://kcodea516.github.io/njucs-serving-notes/
theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/book-open-page-variant
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-night
      name: 切换深色模式
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-sunny
      name: 切换浅色模式
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - navigation.tracking
  - search.suggest
  - search.highlight
  - content.code.copy
plugins:
- search:
    lang:
    - zh
    - en
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.tabbed:
    alternate_style: true
nav:
- 学习路线: index.md
- 论文精读:
  - papers/index.md
  - A · 推理基础:
    - A1 · 原始笔记: papers/a-inference-foundations/efficient-inference-survey/notes.md
    - A1 · 逐问答疑: papers/a-inference-foundations/efficient-inference-survey/answers.md
  - 精读模板: papers/template.md
  - 实践计划（暂缓，待更新）: practice-plan.md
exclude_docs: '/notes/

  '
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
docs_dir: docs
extra:
  generator: false
not_in_nav: 'papers/a-inference-foundations/efficient-inference-survey/reading-list.md

  papers/b-serving-systems/frameworks.md

  '
